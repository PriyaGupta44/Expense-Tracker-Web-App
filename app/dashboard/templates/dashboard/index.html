{% extends "base.html" %}


{% block title %}
    Dashboard | Expense Tracker
{% endblock %}


{% block content %}

<main class="dashboard-page">

    <div class="container">

        <h1>
            Welcome, {{ current_user.username }}!
        </h1>

        <p>
            Manage your personal finances from here.
        </p>


        <div class="dashboard-actions">

            <a
                href="{{ url_for('expenses.add_expense') }}"
                class="btn"
            >
                + Add Expense
            </a>

            <a
                href="{{ url_for('expenses.list_expenses') }}"
                class="btn"
            >
                View Expenses
            </a>

        </div>

    </div>

</main>

{% endblock %}
